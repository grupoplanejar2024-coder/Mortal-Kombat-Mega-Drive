<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mortal Kombat - Kubo Touch</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        header {
            text-align: center;
            padding: 15px;
            background: #1e1e1e;
        }

        .badge {
            background: #e74c3c;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        #game-card {
            max-width: 500px;
            margin: 20px auto;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .cover-scene {
            width: 100%;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle at 50% 35%, #26201b 0%, #121212 75%);
            perspective: 900px;
            touch-action: none;
        }

        .cover-3d {
            --rx: 0deg;
            --ry: 0deg;
            --gx: 50%;
            --gy: 50%;
            position: relative;
            height: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 10px;
            transform-style: preserve-3d;
            transform: rotateX(var(--rx)) rotateY(var(--ry)) translateZ(0);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
            box-shadow:
                0 18px 35px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(255, 255, 255, 0.12);
        }

        .cover-scene:hover .cover-3d,
        .cover-scene.is-interacting .cover-3d {
            transition: transform 0.08s linear, box-shadow 0.2s ease;
            box-shadow:
                0 26px 45px rgba(0, 0, 0, 0.85),
                0 0 24px rgba(231, 76, 60, 0.22),
                0 0 0 1px rgba(255, 255, 255, 0.22);
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            transform: translateZ(12px);
            user-select: none;
            -webkit-user-drag: none;
        }

        .cover-3d::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 10px;
            border: 2px solid rgba(255, 210, 140, 0.18);
            transform: translateZ(6px);
            pointer-events: none;
        }

        .cover-glare {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            background: radial-gradient(
                circle at var(--gx) var(--gy),
                rgba(255, 255, 255, 0.32) 0%,
                rgba(255, 200, 120, 0.10) 28%,
                rgba(255, 255, 255, 0) 62%
            );
            opacity: 0;
            transition: opacity 0.25s ease;
            transform: translateZ(18px);
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .cover-scene:hover .cover-glare,
        .cover-scene.is-interacting .cover-glare {
            opacity: 1;
        }

        .content { padding: 20px; }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #e74c3c; }
        .meta-info { display: flex; gap: 10px; margin-bottom: 15px; font-size: 13px; color: #aaa; }
        .description { font-size: 14px; line-height: 1.5; color: #ddd; margin-bottom: 15px; }
        .details { font-size: 13px; color: #bbb; margin-bottom: 20px; }
        .details ul { padding-left: 20px; margin: 0; }
        .btn-play {
            display: block;
            width: 100%;
            padding: 12px;
            background: #c0392b;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn-play:hover { background: #a93226; }

        #game-container {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: #000;
            z-index: 10;
            flex-direction: column;
            justify-content: space-between;
        }

        #emulator-wrap {
            position: relative;
            width: 100%;
            height: 54dvh;
            min-height: 220px;
            background: #000;
            overflow: hidden;
        }

        #game {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #emulator-wrap .ejs_virtualGamepad_parent,
        #emulator-wrap [class*="virtualGamepad"] {
            display: none !important;
        }

        #kubo-md-pad {
            display: flex;
            width: 100%;
            height: 46dvh;
            min-height: 270px;
            background: #000;
            padding: 10px 16px 16px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            touch-action: none;
            z-index: 25;
        }

        .pad-main-row {
            width: 100%;
            max-width: 460px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .dpad {
            position: relative;
            width: 138px;
            height: 138px;
            flex-shrink: 0;
        }

        .dpad-btn {
            position: absolute;
            background: #444;
            border: none;
            color: #9e9e9e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            outline: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad-btn:active,
        .dpad-btn.is-pressed {
            background: #666;
            color: #fff;
        }

        .dpad-up { top: 0; left: 46px; width: 46px; height: 48px; border-radius: 6px 6px 0 0; }
        .dpad-down { bottom: 0; left: 46px; width: 46px; height: 48px; border-radius: 0 0 6px 6px; }
        .dpad-left { top: 46px; left: 0; width: 48px; height: 46px; border-radius: 6px 0 0 6px; }
        .dpad-right { top: 46px; right: 0; width: 48px; height: 46px; border-radius: 0 6px 6px 0; }

        .dpad-center {
            position: absolute;
            top: 46px;
            left: 46px;
            width: 46px;
            height: 46px;
            background: #444;
            pointer-events: none;
        }

        .tri-up { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 9px solid #9e9e9e; }
        .tri-down { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 9px solid #9e9e9e; }
        .tri-left { width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 9px solid #9e9e9e; }
        .tri-right { width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 9px solid #9e9e9e; }

        .face-grid { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
        .face-row { display: flex; gap: 12px; }

        .md-circle-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid #9e9e9e;
            background: #141414;
            color: #d8d8d8;
            font-size: 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .md-circle-btn:active,
        .md-circle-btn.is-pressed {
            background: #e74c3c;
            border-color: #fff;
            color: #fff;
            transform: scale(0.95);
        }

        .utility-group { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .utility-row { display: flex; gap: 16px; }

        .md-pill-btn {
            min-width: 68px;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1.5px solid #9e9e9e;
            background: #0c0c0c;
            color: #d8d8d8;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            outline: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .md-pill-btn:active,
        .md-pill-btn.is-pressed,
        .md-pill-btn.is-active {
            background: #333;
            border-color: #fff;
            color: #fff;
        }
    </style>
</head>
<body>

    <header id="top-header">
        <span class="badge">KUBO TOUCH</span>
    </header>

    <div id="game-card">
        <div class="cover-scene" id="cover-scene">
            <div class="cover-3d" id="cover-3d">
                <img class="cover-img" src="Mortal%20kombat.jpeg" alt="Capa Mortal Kombat">
                <div class="cover-glare"></div>
            </div>
        </div>
        <div class="content">
            <h1>Mortal Kombat</h1>

            <div class="meta-info">
                <span>🎮 1-2 Jogadores</span>
                <span>📅 1993</span>
                <span>🕹️ SEGA Mega Drive</span>
            </div>

            <p class="description">
                Entre no torneio mortal de artes marciais com golpes especiais, combos rápidos e finalizações icônicas em combates intensos um contra um.
            </p>

            <div class="details">
                <ul>
                    <li>Gênero: Luta</li>
                </ul>
            </div>

            <button type="button" class="btn-play" id="btn-play" onclick="iniciarJogo()">JOGAR AGORA</button>
        </div>
    </div>

    <div id="game-container">
        <div id="emulator-wrap">
            <div id="game"></div>
        </div>

        <div id="kubo-md-pad" aria-label="Comando Virtual Mega Drive">
            <div class="pad-main-row">
                <div class="dpad">
                    <button type="button" class="dpad-btn dpad-up" data-ejs-btn="4" data-key="w" data-code="KeyW" data-key-code="87" aria-label="Cima">
                        <span class="tri-up"></span>
                    </button>
                    <button type="button" class="dpad-btn dpad-left" data-ejs-btn="6" data-key="a" data-code="KeyA" data-key-code="65" aria-label="Esquerda">
                        <span class="tri-left"></span>
                    </button>
                    <div class="dpad-center"></div>
                    <button type="button" class="dpad-btn dpad-right" data-ejs-btn="7" data-key="d" data-code="KeyD" data-key-code="68" aria-label="Direita">
                        <span class="tri-right"></span>
                    </button>
                    <button type="button" class="dpad-btn dpad-down" data-ejs-btn="5" data-key="s" data-code="KeyS" data-key-code="83" aria-label="Baixo">
                        <span class="tri-down"></span>
                    </button>
                </div>

                <div class="face-grid">
                    <div class="face-row">
                        <button type="button" class="md-circle-btn" data-ejs-btn="10" data-key="q" data-code="KeyQ" data-key-code="81">X</button>
                        <button type="button" class="md-circle-btn" data-ejs-btn="1" data-key="e" data-code="KeyE" data-key-code="69">Y</button>
                        <button type="button" class="md-circle-btn" data-ejs-btn="11" data-key="r" data-code="KeyR" data-key-code="82">Z</button>
                    </div>
                    <div class="face-row">
                        <button type="button" class="md-circle-btn" data-ejs-btn="8" data-key="z" data-code="KeyZ" data-key-code="90">A</button>
                        <button type="button" class="md-circle-btn" data-ejs-btn="0" data-key="x" data-code="KeyX" data-key-code="88">B</button>
                        <button type="button" class="md-circle-btn" data-ejs-btn="9" data-key="c" data-code="KeyC" data-key-code="67">C</button>
                    </div>
                </div>
            </div>

            <div class="utility-group">
                <div class="utility-row">
                    <button type="button" class="md-pill-btn" data-ejs-btn="2" data-key="Shift" data-code="ShiftLeft" data-key-code="16">Modo</button>
                    <button type="button" class="md-pill-btn" data-ejs-btn="3" data-key="Enter" data-code="Enter" data-key-code="13">Start</button>
                </div>
                <div class="utility-row">
                    <button type="button" class="md-pill-btn" id="btn-fast" onclick="ajustarVelocidade(2)">Rápido</button>
                    <button type="button" class="md-pill-btn" id="btn-slow" onclick="ajustarVelocidade(0.5)">Lento</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function initCover3D() {
            const scene = document.getElementById('cover-scene');
            const card = document.getElementById('cover-3d');
            if (!scene || !card) return;

            const maxTilt = 16;

            function updateTilt(clientX, clientY) {
                const rect = scene.getBoundingClientRect();
                const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                const y = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));

                const rotY = ((x - 0.5) * 2 * maxTilt).toFixed(2);
                const rotX = ((0.5 - y) * 2 * maxTilt).toFixed(2);

                card.style.setProperty('--ry', `${rotY}deg`);
                card.style.setProperty('--rx', `${rotX}deg`);
                card.style.setProperty('--gx', `${(x * 100).toFixed(1)}%`);
                card.style.setProperty('--gy', `${(y * 100).toFixed(1)}%`);
            }

            function resetTilt() {
                scene.classList.remove('is-interacting');
                card.style.setProperty('--ry', '0deg');
                card.style.setProperty('--rx', '0deg');
                card.style.setProperty('--gx', '50%');
                card.style.setProperty('--gy', '50%');
            }

            scene.addEventListener('pointerenter', (e) => {
                scene.classList.add('is-interacting');
                updateTilt(e.clientX, e.clientY);
            });

            scene.addEventListener('pointermove', (e) => {
                scene.classList.add('is-interacting');
                updateTilt(e.clientX, e.clientY);
            });

            scene.addEventListener('pointerleave', resetTilt);
            scene.addEventListener('pointercancel', resetTilt);
        })();

        const activePointers = new Map();

        function focusGameCanvas() {
            const canvas = document.querySelector('#game canvas');
            if (canvas && typeof canvas.focus === 'function') {
                canvas.focus({ preventScroll: true });
            }
        }

        function triggerEmulatorButton(isDown, ejsBtnIndex, key, code, keyCode) {
            const emu = window.EJS_emulator;
            const value = isDown ? 1 : 0;

            if (emu) {
                if (typeof emu.simulateInput === 'function') {
                    emu.simulateInput(0, Number(ejsBtnIndex), value);
                } else if (emu.gameManager && typeof emu.gameManager.simulateInput === 'function') {
                    emu.gameManager.simulateInput(0, Number(ejsBtnIndex), value);
                }
            }

            if (!key) return;
            const eventInit = {
                key: key,
                code: code,
                keyCode: keyCode,
                which: keyCode,
                bubbles: true,
                cancelable: true
            };

            const type = isDown ? 'keydown' : 'keyup';
            const canvas = document.querySelector('#game canvas');
            if (canvas) {
                canvas.dispatchEvent(new KeyboardEvent(type, eventInit));
            }
            document.dispatchEvent(new KeyboardEvent(type, eventInit));
            window.dispatchEvent(new KeyboardEvent(type, eventInit));
        }

        function releaseButtonElement(btn) {
            if (!btn) return;
            btn.classList.remove('is-pressed');
            triggerEmulatorButton(
                false,
                btn.getAttribute('data-ejs-btn'),
                btn.getAttribute('data-key'),
                btn.getAttribute('data-code'),
                Number(btn.getAttribute('data-key-code'))
            );
        }

        function initVirtualPad() {
            const buttons = document.querySelectorAll('#kubo-md-pad [data-key]');

            buttons.forEach((btn) => {
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    focusGameCanvas();
                    if (btn.setPointerCapture) {
                        try { btn.setPointerCapture(e.pointerId); } catch (_) {}
                    }
                    activePointers.set(e.pointerId, btn);
                    btn.classList.add('is-pressed');
                    triggerEmulatorButton(
                        true,
                        btn.getAttribute('data-ejs-btn'),
                        btn.getAttribute('data-key'),
                        btn.getAttribute('data-code'),
                        Number(btn.getAttribute('data-key-code'))
                    );
                });

                const endPress = (e) => {
                    e.preventDefault();
                    activePointers.delete(e.pointerId);
                    releaseButtonElement(btn);
                };

                btn.addEventListener('pointerup', endPress);
                btn.addEventListener('pointercancel', endPress);
                btn.addEventListener('lostpointercapture', endPress);
            });

            window.addEventListener('blur', () => {
                activePointers.forEach((btn) => releaseButtonElement(btn));
                activePointers.clear();
            });
        }

        let velocidadeAtual = 1;

        function ajustarVelocidade(alvo) {
            const btnFast = document.getElementById('btn-fast');
            const btnSlow = document.getElementById('btn-slow');

            velocidadeAtual = velocidadeAtual === alvo ? 1 : alvo;

            btnFast.classList.toggle('is-active', velocidadeAtual === 2);
            btnSlow.classList.toggle('is-active', velocidadeAtual === 0.5);

            if (window.EJS_emulator && typeof window.EJS_emulator.setSpeed === 'function') {
                window.EJS_emulator.setSpeed(velocidadeAtual);
            } else if (
                window.EJS_emulator &&
                window.EJS_emulator.gameManager &&
                typeof window.EJS_emulator.gameManager.setFastForwardRatio === 'function'
            ) {
                window.EJS_emulator.gameManager.setFastForwardRatio(velocidadeAtual);
            }
        }

        let jogoIniciado = false;

        function iniciarJogo() {
            if (jogoIniciado) return;
            jogoIniciado = true;

            document.getElementById('top-header').style.display = 'none';
            document.getElementById('game-card').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';

            window.EJS_player = '#game';
            window.EJS_core = 'segaMD';
            window.EJS_gameName = 'Mortal Kombat';
            window.EJS_gameUrl = 'Mortal%20Kombat.smd';
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_startOnLoaded = true;

            window.EJS_defaultControls = {
                0: {
                    0: { value: 'x', value2: 'BUTTON_2' },
                    1: { value: 'e', value2: 'BUTTON_3' },
                    2: { value: 'Shift', value2: 'SELECT' },
                    3: { value: 'Enter', value2: 'START' },
                    4: { value: 'w', value2: 'DPAD_UP' },
                    5: { value: 's', value2: 'DPAD_DOWN' },
                    6: { value: 'a', value2: 'DPAD_LEFT' },
                    7: { value: 'd', value2: 'DPAD_RIGHT' },
                    8: { value: 'z', value2: 'BUTTON_1' },
                    9: { value: 'c', value2: 'BUTTON_4' },
                    10: { value: 'q', value2: 'LEFT_SHOULDER' },
                    11: { value: 'r', value2: 'RIGHT_SHOULDER' }
                },
                1: {}
            };

            initVirtualPad();

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            script.onerror = function () {
                alert('Erro ao carregar o EmulatorJS. Verifique a conexão ou bloqueadores no navegador.');
            };
            document.body.appendChild(script);
        }
    </script>

</body>
</html>
